version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: yt_mp3_dev
    ports:
      - '3001:3001'
    volumes:
      # Mount current code directory into container for hot-reload
      - .:/app
      # Prevent host node_modules from overwriting container's node_modules
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=3001
    restart: unless-stopped